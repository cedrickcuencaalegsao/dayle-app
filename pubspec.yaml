name: dayle
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.4.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  intl: ^0.20.2
  google_sign_in: ^6.3.0
  google_sign_in_android: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/Icon.png
    - assets/icons/google.png
    - assets/icons/message.png
  fonts:
    - family: "AntipastoPro"
      fonts:
        - asset: assets/fonts/AntipastoPro-DemiBold_trial.ttf
    - family: "FredokaOne"
      fonts:
        - asset: assets/fonts/FredokaOne-Regular.ttf
